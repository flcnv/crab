[project]
name = "crab"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "imagehash>=4.3.2",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "kagglehub>=1.0.3",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["app", "eval", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # shadowing builtins
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return statements
    "PTH",      # pathlib over os.path
    "DTZ",      # timezone-aware datetimes
    "T20",      # no print()
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "FAST",     # FastAPI
    "PT",       # pytest style
    "PERF",     # performance
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]   # assert, test passwords, subprocess
"eval/**" = ["T20"]                     # CLI prints results
"migrations/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
